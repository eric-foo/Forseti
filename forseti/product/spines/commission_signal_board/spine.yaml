  old_prompt: docs/prompts/product-planning/orca_commission_signal_board_prompt_v0.md
  playbook: docs/workflows/commission_signal_board_playbook_v0.md

shared_external_surfaces:
  validator_script: .agents/hooks/check_commission_signal_board_output.py
  validator_unit_tests: forseti-harness/tests/unit/test_commission_signal_board_output_validator.py
  validator_fixtures: forseti-harness/tests/fixtures/commission_signal_board_outputs/
  repo_map: docs/workflows/forseti_repo_map_v0.md
  structure_binding: docs/decisions/forseti_repo_structure_binding_v0.md
