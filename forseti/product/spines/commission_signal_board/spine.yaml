version: 1
status: live_pilot_spine
spine: commission_signal_board
owner_authorization:
  date: 2026-06-18
  scope: docs_only_commission_signal_board_pilot_spine
  global_docs_migration: staged_not_executed
authority_boundary: retrieval_only_docs_structure_not_runtime

commission_contract:
  modes: [backtest, forward]
  commission_profiles: [standard_signal_board, company_competitive_intelligence]
  default_profile_for_one_company_brand_or_org: company_competitive_intelligence
  time_postures: [recency_first, longitudinal]
  universal_time_posture_default: recency_first
  company_report:
    section_count: 10
    classifier_handoff: omitted
    company_surface_disposition: candidate_only_not_imported
    subject_scope: one_company

intelligence_cycle_contract:
  canonical_name: Forseti Intelligence Cycle
  phases: [understanding, deliver]
  historical_phase_vocabulary: {problem_framing: deliver, problem: deliver}
  normal_turns_per_phase: [acquire_and_seal, synthesize]
  historical_turn_vocabulary: {deliver_as_turn_name: synthesize}
  normal_turn_budget_not_completion_cap: true
  acquisition_gate:
    understanding_synthesize: passing_understanding_phase_seal
    deliver_synthesize: passing_understanding_seal_plus_typed_supplement_capture_returns
    supplement_ceiling_rule: supplement_that_would_change_a_sealed_claim_ceiling_requires_deliver_phase_acquire_and_seal_with_own_seal
    ceiling_seal_composition: deliver_seal_augments_understanding_seal_both_required; deliver_seal_ceilings_govern_named_claims_only; all_other_claims_stay_under_understanding_ceilings
  company_understanding_acquisition_sequence:
    - define_question_and_validate_commission_board
    - serp_phase1_competitor_scout
    - specialist_fanout_co1_co2_co3
    - serp_phase2_targeted_return
    - seal_understanding
  serp_phase_labels_are_internal_not_cycle_phases: true
  outcome_signals:
    - question_fit
    - evidence_foundation
    - reasoning_quality
    - honest_uncertainty
    - implications_and_foresight
    - communication_efficiency
  numeric_score: not_part_of_this_contract

canonical_artifacts:
  readme: forseti/product/spines/commission_signal_board/README.md
  prompt_structure_rules: forseti/product/spines/commission_signal_board/authority/forseti_commission_signal_board_prompt_structure_rules_v0.md
  prompt_structure: forseti/product/spines/commission_signal_board/prompts/forseti_commission_signal_board_prompt_structure_v0.md
  playbook: forseti/product/spines/commission_signal_board/workflows/commission_signal_board_playbook_v0.md
  deliver_decision_memorandum_method: forseti/product/spines/commission_signal_board/workflows/deliver_decision_memorandum_method_v0.md
  phase_vocabulary_migration: forseti/product/spines/commission_signal_board/migrations/intelligence_cycle_phase_vocabulary_migration_v0.md
  validator_pointer: forseti/product/spines/commission_signal_board/harness/validator.md
  tests_pointer: forseti/product/spines/commission_signal_board/tests/validator_tests.md
  moved_paths_index: forseti/product/spines/commission_signal_board/migrations/moved_paths_index.md

legacy_non_controlling_artifacts:
  demand_gate_run_commission_criteria:
    path: forseti/product/spines/commission_signal_board/dispatch_rules/forseti_demand_gate_run_commission_criteria_v0.md
    status: historical_only_not_live_csb_dispatch
    current_authority:
      - forseti/product/spines/commission_signal_board/prompts/forseti_commission_signal_board_prompt_structure_v0.md
      - forseti/product/spines/commission_signal_board/workflows/commission_signal_board_playbook_v0.md
    reason: csb_is_signal_board_not_demand_gate

legacy_absent_paths:
