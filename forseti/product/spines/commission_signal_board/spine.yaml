  machine_map: repo-structure.yaml

non_goals:
  - no_global_docs_move
  - no_validator_code_move
  - no_test_or_fixture_move
  - no_runtime_authorization
  - no_retrieval_or_scraping_authorization
  - no_demand_classification
  - no_graph_construction
  - no_buyer_proof_or_readiness_claim
  - no_gtm_interpretation
  - no_scanning_or_capture_runtime
  - no_company_surface_import
  - no_numeric_working_score
  - no_company_report_layout_redesign
